name: github pages
permissions:
  contents: write

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: "Dioxus Deploy"
        uses: uthea/dioxus-deploy-action@1.4
        with:
          version: "0.7.10"
          basePath: "dioxus-digital-bank"
